<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

/* Filter Buttons */
.filter-buttons{
    text-align:center;
    margin-bottom:20px;
}

.filter-buttons button{
    padding:10px 20px;
    margin:5px;
    border:none;
    background:#333;
    color:white;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

.filter-buttons button:hover{
    background:orange;
}

/* Gallery Grid */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.gallery-item{
    overflow:hidden;
    border-radius:10px;
}

.gallery-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    cursor:pointer;
    transition:transform 0.5s ease;
}

.gallery-item img:hover{
    transform:scale(1.1);
}

/* Lightbox */
.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.lightbox img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:35px;
    cursor:pointer;
}

.prev,
.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    color:white;
    font-size:40px;
    cursor:pointer;
    padding:10px;
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

@media(max-width:768px){

    .lightbox img{
        max-width:95%;
    }

    .prev,
    .next{
        font-size:30px;
    }
}
</style>
</head>
<body>

<h1>Image Gallery</h1>

<div class="filter-buttons">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animals')">Animals</button>
    <button onclick="filterImages('cities')">Cities</button>
</div>

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1015/600/400" onclick="openLightbox(0)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/237/600/400" onclick="openLightbox(1)">
    </div>

    <div class="gallery-item cities">
        <img src="https://picsum.photos/id/1011/600/400" onclick="openLightbox(2)">
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1040/600/400" onclick="openLightbox(3)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/1025/600/400" onclick="openLightbox(4)">
    </div>

    <div class="gallery-item cities">
        <img src="https://picsum.photos/id/1031/600/400" onclick="openLightbox(5)">
    </div>

</div>

<!-- Lightbox -->

<div class="lightbox" id="lightbox">

    <span class="close" onclick="closeLightbox()">&times;</span>

    <span class="prev" onclick="changeImage(-1)">&#10094;</span>

    <img id="lightbox-img">

    <span class="next" onclick="changeImage(1)">&#10095;</span>

</div>

<script>

const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let currentIndex = 0;

function openLightbox(index){

    currentIndex = index;

    lightbox.style.display = "flex";

    lightboxImg.src = images[index].src;
}

function closeLightbox(){

    lightbox.style.display = "none";
}

function changeImage(direction){

    currentIndex += direction;

    if(currentIndex < 0){
        currentIndex = images.length - 1;
    }

    if(currentIndex >= images.length){
        currentIndex = 0;
    }

    lightboxImg.src = images[currentIndex].src;
}

function filterImages(category){

    const items =
    document.querySelectorAll(".gallery-item");

    items.forEach(item => {

        if(category === "all"){
            item.style.display = "block";
        }
        else if(item.classList.contains(category)){
            item.style.display = "block";
        }
        else{
            item.style.display = "none";
        }

    });
}

window.onclick = function(event){

    if(event.target === lightbox){
        closeLightbox();
    }
};

</script>

</body>
</html>
